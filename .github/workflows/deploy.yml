name: Pubblica su Aruba (LIVE)

# GO-LIVE del 2026-07-13: il sito viene compilato e pubblicato alla RADICE
# di www.cooprimavera.com a ogni push su main (niente più /anteprima/,
# niente noindex). Backup del vecchio sito: artifact "backup-vecchio-sito-
# cooprimavera" (90 giorni) + backup automatici Aruba + export locale.
on:
  push:
    branches: [main]
    # I file di coordinamento fra le sessioni non cambiano il sito.
    paths-ignore:
      - "COORDINAMENTO.md"
      - "AGENTS.md"
  workflow_dispatch:
  # Lunedì e giovedì dopo le 9:00 italiane: ricompila il sito così compare la
  # notizia del giorno (le pagine con data futura restano nascoste fino ad allora)
  schedule:
    - cron: "20 7,8 * * 1,4"

concurrency:
  group: deploy-aruba
  cancel-in-progress: false

# Il token di GitHub ha solo ciò che serve a questo lavoro.
permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # cronologia completa: Hugo ricava la data di ultima modifica di ogni
          # pagina dai commit (enableGitInfo) e la scrive nella sitemap
          fetch-depth: 0

      - name: Installa Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Compila il sito
        run: hugo --minify

      - name: Pubblica via FTPS su Aruba
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # il certificato del server Aruba è intestato al nome macchina:
          # la verifica stretta del nome host fallirebbe
          security: loose
          local-dir: public/
          server-dir: www.cooprimavera.com/

      # Segnala ai motori IndexNow (Bing, Yandex…) le pagine cambiate oggi.
      # Non blocca mai la pubblicazione.
      - name: Segnala le pagine nuove ai motori di ricerca (IndexNow)
        continue-on-error: true
        run: python3 scripts/indexnow.py public/sitemap.xml
