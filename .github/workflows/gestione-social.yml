name: "🛠️ Gestione social"

# Gestione completa di pagina Facebook e Instagram (scripts/gestione_social.py).
# Due modi di avviarlo, entrambi raggiungibili da qualsiasi dispositivo:
#  - a mano: Actions → Gestione social → Run workflow (anche dall'app GitHub);
#  - con un push del file .github/social/comando.json su un ramo diverso da main
#    (così lo avvia anche una sessione cloud): l'esito viene scritto in
#    .github/social/esito.md sullo stesso ramo.
# Eliminare richiede sempre conferma = ELIMINA.

on:
  workflow_dispatch:
    inputs:
      azione:
        description: "Cosa fare"
        required: true
        type: choice
        options: [pubblica-oggi, programma-calendario, elenco, statistiche, esporta, elimina-tutti, commenti, messaggi, pubblica, modifica, elimina, rispondi-commento, nascondi-commento, elimina-commento, rispondi-messaggio, prova]
      rete:
        description: "Facebook o Instagram"
        required: true
        type: choice
        options: [fb, ig]
      id:
        description: "Identificativo di post, commento o conversazione (per Instagram anche il link del post)"
        required: false
        type: string
      testo:
        description: "Testo (post, risposta, messaggio). Per nascondi-commento: mostra = rendi visibile"
        required: false
        type: string
      immagine_url:
        description: "Link pubblico di un'immagine JPEG (obbligatorio per pubblicare su Instagram)"
        required: false
        type: string
      quando:
        description: "Solo Facebook: data e ora di pubblicazione programmata, es. 2026-10-05T09:00:00+02:00"
        required: false
        type: string
      conferma:
        description: "Per eliminare scrivi ELIMINA"
        required: false
        type: string
  # Calendario social: lunedì e giovedì alle 9:00 italiane pubblica il post del
  # giorno (07:00 UTC con l'ora legale, 08:00 con quella solare: il giro che
  # arriva prima delle 9 non trova nulla da fare, l'altro salta i doppioni).
  schedule:
    # Minuto 7, non 0: allo scoccare dell'ora GitHub ritarda o salta gli avvii (5/10/2026).
    # Almeno tre tentativi dopo le 9 italiane (anche con l'ora solare): il primo fa il lavoro, gli altri non ripubblicano.
    - cron: "7 7,8,9,10 * * 1,4"
  push:
    branches-ignore: [main]
    paths: [".github/social/comando.json"]

permissions:
  contents: write

concurrency:
  group: gestione-social
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Un push che cancella comando.json (pulizia del ramo) non è un comando: niente da fare.
      - name: Esegui
        if: github.event_name != 'push' || hashFiles('.github/social/comando.json') != ''
        env:
          PAGE_ID: ${{ secrets.META_PAGE_ID }}
          PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          AZIONE: ${{ github.event_name == 'schedule' && 'pubblica-oggi' || inputs.azione }}
          RETE: ${{ inputs.rete }}
          ID: ${{ inputs.id }}
          TESTO: ${{ inputs.testo }}
          IMMAGINE_URL: ${{ inputs.immagine_url }}
          CONFERMA: ${{ inputs.conferma }}
          QUANDO: ${{ inputs.quando }}
          COMANDO_FILE: ${{ github.event_name == 'push' && '.github/social/comando.json' || '' }}
          ESITO_FILE: ${{ github.event_name == 'push' && '.github/social/esito.md' || '' }}
        run: python3 scripts/gestione_social.py

      - name: Archivio come artifact (anche da avvio manuale)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archivio-social
          path: archivio-social
          if-no-files-found: ignore
          retention-days: 90

      - name: Salva l'esito sul ramo
        if: always() && github.event_name == 'push'
        run: |
          [ -f .github/social/esito.md ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .github/social/esito.md
          [ -d archivio-social ] && git add archivio-social
          git commit -m "Gestione social: esito" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
