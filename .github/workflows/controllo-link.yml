name: "🔗 Controllo link del sito"

# Ogni settimana compila il sito come la pubblicazione e controlla TUTTI i link,
# interni ed esterni, con lychee. Ogni 404, 410 o file del sito mancante rende
# rosso il run (scripts/controlla-link-rotti.py) e tiene aggiornata la issue
# «Link rotti sul sito», che si chiude da sola quando i link rotti sono zero.
# Timeout, errori 5xx e blocchi anti-bot restano solo nel rapporto: sono passeggeri.
# Istruzione di Alessandro del 17/10/2026: gli errori 404 non si ignorano mai.

on:
  schedule:
    - cron: "37 6 * * 2"   # martedì 08:37 italiane con l'ora legale
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: controllo-link
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # come deploy.yml: Hugo legge le date dai commit

      - name: Installa Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.154.5"
          extended: true

      - name: Compila il sito (come la pubblicazione)
        run: hugo --minify --baseURL "https://www.cooprimavera.com/"

      - name: Controlla i link con lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --root-dir risolve i percorsi /… contro il sito compilato
          # il percorso delle pagine va tra virgolette: lo espande lychee in tutte
          # le sottocartelle; senza, la shell lo riduce alle pagine di secondo livello
          # --accept   403 e 429: siti che bloccano i programmi ma funzionano per chi legge
          args: >-
            --no-progress
            --accept 200,201,202,203,204,205,206,301,302,303,307,308,403,429
            --timeout 20
            --max-retries 3
            --retry-wait-time 5
            --user-agent "Mozilla/5.0 (compatible; CooprimaveraLinkChecker/1.0; +https://www.cooprimavera.com/)"
            --root-dir "${{ github.workspace }}/public"
            --exclude "^tel:"
            --exclude "^mailto:"
            --exclude "^#"
            "public/**/*.html"
          output: ./lychee-report.md
          format: markdown
          fail: false

      - name: Rapporto completo nel riepilogo del run
        if: always()
        run: '[ -f lychee-report.md ] && cat lychee-report.md >> "$GITHUB_STEP_SUMMARY" || true'

      - name: Link rotti → issue in-place e run rosso
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITOLO="Link rotti sul sito"
          N=$(gh issue list --state open --search "\"$TITOLO\" in:title" --json number,title \
                --jq ".[] | select(.title == \"$TITOLO\") | .number" | head -n1)
          if python3 scripts/controlla-link-rotti.py lychee-report.md corpo-issue.md; then
            if [ -n "$N" ]; then
              gh issue close "$N" --comment "Nessun link rotto nel controllo di oggi: chiusa in automatico."
            fi
            exit 0
          fi
          if [ ! -f corpo-issue.md ]; then
            echo "Il rapporto di lychee manca: il controllo non è stato eseguito."
            exit 1
          fi
          echo "[Log del controllo](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> corpo-issue.md
          if [ -n "$N" ]; then
            gh issue edit "$N" --body-file corpo-issue.md
          else
            gh issue create --title "$TITOLO" --label automazione --label fonte-rotta --body-file corpo-issue.md
          fi
          exit 1
