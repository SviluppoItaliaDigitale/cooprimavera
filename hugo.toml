baseURL = "https://www.cooprimavera.com/"
languageCode = "it-IT"
title = "Cooprimavera Società Cooperativa"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
# Niente meta generator nell'HTML: un tag in meno in ogni pagina
disableHugoGeneratorInject = true
# Data di ultima modifica dal commit git: finisce nel <lastmod> della sitemap
# (il deploy fa il checkout con tutta la cronologia, vedi deploy.yml)
enableGitInfo = true

[frontmatter]
lastmod = [":git", "lastmod", "date", "publishDate"]

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[imaging]
quality = 80
resampleFilter = "Lanczos"

[markup.goldmark.renderer]
unsafe = true

[params]
descrizione = "Cooprimavera Società Cooperativa — impresa multiservizi dei Castelli Romani: pulizie professionali, sanificazioni, disinfestazioni, giardinaggio, portierato e allestimenti per eventi."
claim = "Il miglior partner per il tuo business"
# Suffisso dei <title> delle pagine interne
titolo_suffisso = "Cooprimavera"
# Immagine di anteprima (Facebook, WhatsApp, LinkedIn) quando la pagina non ne ha una propria
immagine_social = "img/squadra.jpg"
anno_fondazione = 2006
telefono_cell = "331 777 1888"
telefono_cell_link = "+393317771888"
telefono_uff = "06 63 46 70"
telefono_uff_link = "+3906634670"
whatsapp = "06 63 46 70"
whatsapp_link = "https://wa.me/3906634670"
orari = "lun–gio 9:00–14:00 · ven 9:00–18:00"
email = "info@cooprimavera.com"
pec = "cooprimavera@pec.it"
piva = "09176751007"
sede_operativa = "Via Giuseppe Lugli 2/4 — 00072 Ariccia (RM)"
sede_legale = "Viale Don Morosini 100 — 00045 Genzano di Roma (RM)"
# Coordinate della sede operativa (Via Giuseppe Lugli, Ariccia) per lo schema LocalBusiness
geo_lat = 41.7246
geo_lon = 12.6779
mappa_link = "https://www.google.com/maps/dir//Via+Giuseppe+Lugli+2,+00072+Ariccia+RM"

[params.social]
facebook = "https://www.facebook.com/Cooprimavera"
